spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jewellery}
    username: ${DB_USERNAME:jewellery}
    password: ${DB_PASSWORD:jewellery}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jewellery:
  bootstrap:
    admin-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@2026}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-only-secret-key-change-me-please-0123456789}
  storefront:
    # Local only: every OTP is 123456, and the single company answers to the
    # key the customer app ships with.
    otp:
      fixed-code: ${STOREFRONT_OTP_FIXED_CODE:123456}
    bootstrap-tenant-key: ${STOREFRONT_BOOTSTRAP_TENANT_KEY:fino}

logging:
  level:
    com.finotech.jewellery: DEBUG

server:
  port: ${SERVER_PORT:8081}
