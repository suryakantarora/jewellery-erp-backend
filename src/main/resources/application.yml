spring:
  application:
    name: jewellery-platform
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

jewellery:
  security:
    jwt:
      issuer: jewellery-platform
      secret: ${JWT_SECRET:}
      access-token-minutes: ${JWT_ACCESS_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_DAYS:14}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health/**
  storage:
    # 'local' writes to disk and is the development default. It is not suitable
    # for more than one instance; use a shared object store in production.
    provider: ${STORAGE_PROVIDER:local}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:jewellery}
    local-path: ${STORAGE_LOCAL_PATH:./storage}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
  compliance:
    # Reporting thresholds. Jurisdictions differ and limits change, so these are
    # configuration rather than constants.
    high-value-sale-amount: ${COMPLIANCE_HIGH_VALUE_SALE:100000000}
    high-value-cash-amount: ${COMPLIANCE_HIGH_VALUE_CASH:50000000}
    structuring-window-days: ${COMPLIANCE_STRUCTURING_WINDOW_DAYS:30}
    structuring-count: ${COMPLIANCE_STRUCTURING_COUNT:3}
  notification:
    # 'logging' writes messages to the log instead of sending them. Replace with
    # a real provider by registering a NotificationSender bean per channel.
    transport: ${NOTIFICATION_TRANSPORT:logging}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:30000}

# Multipart limits are enforced by the container as well as by the service, so
# an oversized upload is rejected before it is buffered.
spring.servlet.multipart:
  max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:10MB}
  max-request-size: ${STORAGE_MAX_REQUEST_SIZE_MB:12MB}
