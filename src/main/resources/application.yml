spring:
  application:
    name: jewellery-platform
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

jewellery:
  security:
    jwt:
      issuer: jewellery-platform
      secret: ${JWT_SECRET:}
      access-token-minutes: ${JWT_ACCESS_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_DAYS:14}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health/**
      # The forced-update gate runs before login, so it must be reachable anonymously.
      - /api/v1/app/version
      # The customer app: branding, catalogue and content are anonymous, and
      # sign-in has to be reachable before there is a token.
      - /api/v1/public/**
      - /api/v1/customer-auth/**
  app:
    # Mobile app version gate: GET /api/v1/app/version. A client older than
    # min-supported is told to update before it can continue. Store URLs are
    # empty until the listings exist.
    versions:
      android:
        min-supported: ${APP_ANDROID_MIN_SUPPORTED:0.1.0}
        latest: ${APP_ANDROID_LATEST:0.1.0}
        store-url: ${APP_ANDROID_STORE_URL:}
        message: ${APP_ANDROID_MESSAGE:}
      ios:
        min-supported: ${APP_IOS_MIN_SUPPORTED:0.1.0}
        latest: ${APP_IOS_LATEST:0.1.0}
        store-url: ${APP_IOS_STORE_URL:}
        message: ${APP_IOS_MESSAGE:}
  storage:
    # 'local' writes to disk and is the development default. It is not suitable
    # for more than one instance; use a shared object store in production.
    provider: ${STORAGE_PROVIDER:local}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:jewellery}
    local-path: ${STORAGE_LOCAL_PATH:./storage}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:10485760}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
  storefront:
    # Customer app. A fixed OTP code is for development and store-review
    # accounts only: when set, no SMS is sent and that code always verifies.
    otp:
      length: 6
      ttl-seconds: ${STOREFRONT_OTP_TTL_SECONDS:300}
      resend-seconds: ${STOREFRONT_OTP_RESEND_SECONDS:30}
      max-attempts: ${STOREFRONT_OTP_MAX_ATTEMPTS:5}
      fixed-code: ${STOREFRONT_OTP_FIXED_CODE:}
    customer-token-days: ${STOREFRONT_CUSTOMER_TOKEN_DAYS:90}
    catalogue-cache-seconds: ${STOREFRONT_CATALOGUE_CACHE_SECONDS:60}
    bootstrap-tenant-key: ${STOREFRONT_BOOTSTRAP_TENANT_KEY:}
  compliance:
    # Reporting thresholds. Jurisdictions differ and limits change, so these are
    # configuration rather than constants.
    high-value-sale-amount: ${COMPLIANCE_HIGH_VALUE_SALE:100000000}
    high-value-cash-amount: ${COMPLIANCE_HIGH_VALUE_CASH:50000000}
    structuring-window-days: ${COMPLIANCE_STRUCTURING_WINDOW_DAYS:30}
    structuring-count: ${COMPLIANCE_STRUCTURING_COUNT:3}
  notification:
    # 'logging' writes messages to the log instead of sending them. Replace with
    # a real provider by registering a NotificationSender bean per channel.
    transport: ${NOTIFICATION_TRANSPORT:logging}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:30000}
    # Currency quoted in staff alerts (the sale event carries none).
    currency: ${NOTIFICATION_CURRENCY:LAK}
    push:
      # Off by default: with no Firebase project, PUSH rows go to the log. When
      # on, credentials-file must point at the service-account JSON from the
      # Firebase console; a missing file fails each row with "push not configured".
      enabled: ${FCM_ENABLED:false}
      credentials-file: ${FCM_CREDENTIALS_FILE:}

# Multipart limits are enforced by the container as well as by the service, so
# an oversized upload is rejected before it is buffered.
spring.servlet.multipart:
  max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:10MB}
  max-request-size: ${STORAGE_MAX_REQUEST_SIZE_MB:12MB}
